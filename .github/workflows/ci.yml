# Pipeline de CI para o projeto house-prices-ml.
#
# Fluxo geral (cada job so roda se o anterior passar, via "needs"):
#   1) lint               -> checa estilo/qualidade do codigo (ruff)
#   2) test                -> roda os testes unitarios com cobertura (pytest)
#   3) train-smoke-test     -> treina o modelo de ponta a ponta com uma amostra
#                              pequena de dados, so pra garantir que o pipeline
#                              de treino nao quebrou (nao mede qualidade do modelo)
name: CI - house-prices-ml

# Quando o workflow deve rodar.
#
# GOVERNANCA: o CI so dispara se o push/PR tocar em algo que realmente
# pode quebrar o modelo, os testes ou a API (as partes "criticas" do
# projeto). Mudar so um notebook, o README ou a documentacao NAO dispara
# o CI - essa lista de "paths" abaixo E a lista do que conta como critico.
# Pra saber antecipadamente se um PR vai rodar o CI, basta comparar os
# arquivos alterados (aba "Files changed" do PR, ou "git diff --name-only")
# com os padroes listados aqui.
on:
  push:
    branches: [main]
    paths:
      # Codigo fonte do pacote: modelo/treino (train.py), limpeza de dados
      # (data/clean.py), feature engineering (features.py) e API (api/*).
      - "house-prices-ml/src/house_prices/**"
      # Testes automatizados.
      - "house-prices-ml/tests/**"
      # Dependencias/config do projeto (mudar uma dependencia pode quebrar
      # lint, testes ou treino).
      - "house-prices-ml/pyproject.toml"
      # Amostra de dados usada pelo job de smoke test de treino.
      - "house-prices-ml/data/sample/**"
      # O proprio workflow (se a esteira de CI mudar, ela precisa ser testada).
      - ".github/workflows/ci.yml"
  # Mesma logica, mas para Pull Requests direcionados a main.
  pull_request:
    branches: [main]
    paths:
      - "house-prices-ml/src/house_prices/**"
      - "house-prices-ml/tests/**"
      - "house-prices-ml/pyproject.toml"
      - "house-prices-ml/data/sample/**"
      - ".github/workflows/ci.yml"
  # Permite rodar manualmente pela aba "Actions" do GitHub (botao "Run workflow"),
  # ignorando os filtros de path acima - util pra forcar uma rodada mesmo
  # quando so a documentacao/notebooks mudaram.
  workflow_dispatch:

# Todos os "run" dos jobs abaixo vao executar dentro dessa pasta por padrao,
# entao os comandos podem ser escritos como se estivessem la (ex: "pytest" em
# vez de "pytest house-prices-ml").
defaults:
  run:
    working-directory: house-prices-ml

jobs:
  # ---------------------------------------------------------------------
  # JOB 1: Lint - checagem estatica de qualidade/estilo do codigo.
  # E o mais rapido, por isso roda primeiro: se o codigo tem problema
  # basico de estilo, nem vale a pena gastar tempo rodando testes.
  # ---------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instala o pacote em modo editavel + dependencias extras de dev
      # (definidas em pyproject.toml, seção [project.optional-dependencies].dev),
      # que incluem ferramentas como ruff e pytest.
      - name: Instalar dependencias de dev
        run: pip install -e ".[dev]"

      - name: Rodar ruff
        run: ruff check src tests

  # ---------------------------------------------------------------------
  # JOB 2: Testes automatizados - valida o comportamento do codigo
  # (funcoes de limpeza, features, treino, API) com pytest.
  # Só roda depois do lint passar ("needs: lint").
  # ---------------------------------------------------------------------
  test:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de dev
        run: pip install -e ".[dev]"

      # --cov mede a cobertura de testes do pacote house_prices.
      # --cov-report=term-missing mostra no log quais linhas nao foram
      # cobertas por nenhum teste.
      - name: Rodar testes com cobertura
        run: pytest --cov=house_prices --cov-report=term-missing

  # ---------------------------------------------------------------------
  # JOB 3: Smoke test de treino ponta-a-ponta - roda o script de treino
  # de verdade (nao um mock) usando uma amostra pequena de dados versionada
  # no repo (data/sample/), sem depender de baixar o dataset do Kaggle.
  # O objetivo aqui NAO e validar a qualidade do modelo, e sim garantir
  # que o pipeline inteiro (ler dados -> treinar -> salvar artefatos)
  # continua funcionando de ponta a ponta.
  # Só roda depois que os testes unitarios passarem ("needs: test").
  # ---------------------------------------------------------------------
  train-smoke-test:
    name: Treino ponta-a-ponta (dataset amostral)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Aqui so precisamos do pacote em si (sem extras de dev), pois esse
      # job so executa o script de treino, nao roda lint nem pytest.
      - name: Instalar dependencias
        run: pip install -e "."

      - name: Treinar modelo na amostra versionada (sem depender do Kaggle)
        run: |
          python -m house_prices.train --data data/sample/house_prices_sample.csv

      # Checagem simples de "sanidade": se os arquivos existem, o treino
      # rodou e gerou os artefatos esperados. O cat no final so serve pra
      # deixar as metricas visiveis no log do Actions.
      - name: Validar que o modelo e as metricas foram gerados
        run: |
          test -f models/model.joblib
          test -f models/metrics.json
          cat models/metrics.json
